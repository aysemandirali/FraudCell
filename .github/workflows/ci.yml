name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FraudCell.sln
      - run: dotnet build FraudCell.sln -c Release --no-restore --nologo -m:1

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND/src/Ai/fraudcell-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.31
      - run: uv sync --frozen --group dev --group test
      - run: uv run --group dev --group test ruff check app tests
      - run: uv run --group dev --group test mypy app
      - run: uv run --group test pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONTEND/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: FRONTEND/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run contracts:generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
        working-directory: BACKEND
