[project]
name = "fraudcell-ai"
version = "1.0.0"
description = "FraudCell AI Service: risk scoring, fraud-type classification, analyst ranking"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<1.15",
    "psycopg[binary]>=3.2,<3.3",
    "aio-pika>=9.5,<9.6",
    "scikit-learn>=1.5,<1.6",
    "numpy>=2.1,<2.2",
    "joblib>=1.4,<1.5",
    "python-ulid>=2.7,<3",
    "google-genai>=1.0,<2",
]

[dependency-groups]
training = [
    "pandas>=2.2,<2.3",
]
dev = [
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<1.14",
]
test = [
    "pytest>=8.3,<8.4",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "coverage>=7.6,<7.7",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
