name: fraudcell

# =============================================================================
# FraudCell — Backend Docker Compose
# =============================================================================
# Bu dosya docs/11-FINAL-DELIVERY-PLAYBOOK.md §27-34 ve docs/03-TECH-STACK.md
# §39-40'ta kilitlenen kararlarin, BUGUN repository'de gercekten var olan
# servisler icin uygulanmis halidir.
#
# ONEMLI — mimari dokumanla fark:
#   Nihai mimaride 5 uzun-sureli servis (Edge/YARP Gateway, Identity, Transaction,
#   AI, Gamification) + 4 PostgreSQL bulunmasi planlaniyor. Su an Docker'da
#   Edge Gateway + 3 ASP.NET Core servisi (Identity, Transaction, Gamification)
#   + 3 veritabani + RabbitMQ ayaga kalkar.
#
#   Python/FastAPI AI Service kodu repository'de var, fakat henuz Docker Compose'a
#   bagli degil. AI fazinda ai-service + ai-db eklenecektir.
#
# Kullanim:
#   cp .env.example .env      (zaten .env mevcutsa atlayin)
#   docker compose up -d --build
#   docker compose ps
#   docker compose logs -f transaction-service
#   docker compose down            # container'lari durdurur, veri volume'lari kalir
#   docker compose down -v         # veri volume'larini da siler (demo reset)

networks:
  fraudcell-app:
    name: fraudcell-app
  identity-data:
    name: identity-data
  transaction-data:
    name: transaction-data
  gamification-data:
    name: gamification-data

volumes:
  identity-db-data:
  transaction-db-data:
  gamification-db-data:
  rabbitmq-data:
  identity-keys:

services:
  # ---------------------------------------------------------------------------
  # Veritabanlari — her servisin kendi PostgreSQL container'i (database-per-service)
  # ---------------------------------------------------------------------------
  identity-db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: fraudcell_identity
      POSTGRES_USER: identity_app
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD .env icinde tanimli olmali}
    volumes:
      - identity-db-data:/var/lib/postgresql
    networks:
      - identity-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_app -d fraudcell_identity"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: on-failure:5

  transaction-db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: fraudcell_transaction
      POSTGRES_USER: transaction_app
      POSTGRES_PASSWORD: ${TRANSACTION_DB_PASSWORD:?TRANSACTION_DB_PASSWORD .env icinde tanimli olmali}
    volumes:
      - transaction-db-data:/var/lib/postgresql
    networks:
      - transaction-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transaction_app -d fraudcell_transaction"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: on-failure:5

  gamification-db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: fraudcell_gamification
      POSTGRES_USER: gamification_app
      POSTGRES_PASSWORD: ${GAMIFICATION_DB_PASSWORD:?GAMIFICATION_DB_PASSWORD .env icinde tanimli olmali}
    volumes:
      - gamification-db-data:/var/lib/postgresql
    networks:
      - gamification-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamification_app -d fraudcell_gamification"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: on-failure:5

  # ---------------------------------------------------------------------------
  # Mesajlasma
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fraudcell}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD .env icinde tanimli olmali}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - fraudcell-app
    ports:
      # Management UI yalnizca localhost'a acik (dokuman: debug/dev kolayligi icin).
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    restart: on-failure:5

  # ---------------------------------------------------------------------------
  # Edge Gateway - tek public API girisi
  # ---------------------------------------------------------------------------
  edge-gateway:
    build:
      context: .
      dockerfile: src/Services/Edge/FraudCell.Edge.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Jwt__PublicKeyPath: /keys/identity/public.pem
      ReverseProxy__Clusters__identity__Destinations__identity-service__Address: http://identity-service:8080/
      ReverseProxy__Clusters__transaction__Destinations__transaction-service__Address: http://transaction-service:8080/
      ReverseProxy__Clusters__gamification__Destinations__gamification-service__Address: http://gamification-service:8080/
      ReverseProxy__Clusters__ai__Destinations__ai-service__Address: http://ai-service:8000/
      Logging__LogLevel__Yarp: Warning
      Serilog__MinimumLevel__Override__Yarp: Warning
    volumes:
      - identity-keys:/keys/identity:ro
    depends_on:
      identity-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      gamification-service:
        condition: service_healthy
    networks:
      - fraudcell-app
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: on-failure:5

  # ---------------------------------------------------------------------------
  # Identity Service — kullanici, rol, JWT, refresh token, audit
  # ---------------------------------------------------------------------------
  identity-service:
    build:
      context: .
      dockerfile: src/Services/Identity/FraudCell.Identity.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__IdentityDb: Host=identity-db;Port=5432;Database=fraudcell_identity;Username=identity_app;Password=${IDENTITY_DB_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-fraudcell}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__PrivateKeyPath: /keys/identity/private.pem
      Jwt__PublicKeyPath: /keys/identity/public.pem
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore.Database.Command: Warning
      Outbox__PollIntervalMilliseconds: 2000
    volumes:
      # RSA anahtar cifti burada uretilir (Development ortaminda RsaKeyProvider
      # otomatik uretir) ve diger servislerle bu volume uzerinden paylasilir.
      - identity-keys:/keys/identity
    depends_on:
      identity-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fraudcell-app
      - identity-data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: on-failure:5

  # ---------------------------------------------------------------------------
  # Transaction Service — islem, risk vakasi, state machine, SLA, atama
  # ---------------------------------------------------------------------------
  transaction-service:
    build:
      context: .
      dockerfile: src/Services/Transaction/FraudCell.Transaction.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__TransactionDb: Host=transaction-db;Port=5432;Database=fraudcell_transaction;Username=transaction_app;Password=${TRANSACTION_DB_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-fraudcell}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__PublicKeyPath: /keys/identity/public.pem
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore.Database.Command: Warning
      Outbox__PollIntervalMilliseconds: 2000
    volumes:
      # Yalnizca public key — bu servis token uretemez, yalnizca dogrular.
      - identity-keys:/keys/identity:ro
    depends_on:
      transaction-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - fraudcell-app
      - transaction-data
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    restart: on-failure:5

  # ---------------------------------------------------------------------------
  # Gamification Service — puan, rozet, seviye, leaderboard
  # ---------------------------------------------------------------------------
  gamification-service:
    build:
      context: .
      dockerfile: src/Services/Gamification/FraudCell.Gamification.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__GamificationDb: Host=gamification-db;Port=5432;Database=fraudcell_gamification;Username=gamification_app;Password=${GAMIFICATION_DB_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-fraudcell}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__PublicKeyPath: /keys/identity/public.pem
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore.Database.Command: Warning
      Outbox__PollIntervalMilliseconds: 2000
    volumes:
      - identity-keys:/keys/identity:ro
    depends_on:
      gamification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - fraudcell-app
      - gamification-data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: on-failure:5
